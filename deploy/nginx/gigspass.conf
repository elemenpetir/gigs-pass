# Gigs Pass - EC2 host reverse proxy (Opsi B)
# Pasang di: /etc/nginx/sites-available/gigspass -> symlink ke sites-enabled/
# Arsitektur: /api/* -> backend container (127.0.0.1:5000), /* -> frontend container (127.0.0.1:3000)

# --- Benteng luar: rate limiting per IP (request ditolak sebelum menyentuh Node) ---
limit_req_zone $binary_remote_addr zone=auth:1m rate=10r/m;
limit_req_zone $binary_remote_addr zone=general:10m rate=600r/m;
limit_req_status 429;

upstream gigs_backend {
    server 127.0.0.1:5000;
    keepalive 32;
}

upstream gigs_frontend {
    server 127.0.0.1:3000;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    # Upload poster event (Cloudinary)
    client_max_body_size 10m;

    # --- Auth: kalibrasi ketat berbasis kegagalan (selaras app limiter) ---
    location /api/auth/ {
        limit_req zone=auth burst=20 nodelay;

        proxy_pass http://gigs_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # --- API umum + SSE-safe (/api/queue/:id/stream) ---
    location /api/ {
        limit_req zone=general burst=50 nodelay;

        proxy_pass http://gigs_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE: tanpa buffering, koneksi panjang
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Connection "";
    }

    # --- Frontend static + SPA (container nginx) ---
    location / {
        proxy_pass http://gigs_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
