services:
  gigs-backend:
    image: ghcr.io/elemenpetir/gigs-pass/backend:latest
    container_name: gigs-backend
    restart: always
    env_file: .env
    ports:
      - "5000:5000"
    networks:
      - gigspass-net

  gigs-frontend:
    image: ghcr.io/elemenpetir/gigs-pass/frontend:latest
    container_name: gigs-frontend
    restart: always
    ports:
      - "3000:80"
    networks:
      - gigspass-net

networks:
  gigspass-net:
    driver: bridge
