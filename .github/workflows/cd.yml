name: Deploy to AWS EC2

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

  # Auto-deploy setelah CI lulus di main: buka blok di bawah ini
  # (pastikan job CI bernama sesuai dan secrets EC2 sudah terisi)
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    environment: ${{ github.event.inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}

      - name: Add EC2 to known hosts
        run: |
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      # .env produksi DIBUAT SEKALI secara manual di server
      # (lihat docs/deployment.md) - workflow hanya pull + rebuild.
      - name: Deploy via Docker Compose
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -o StrictHostKeyChecking=no "$EC2_USER@$EC2_HOST" << 'SCRIPT'
            set -e
            cd /opt/gigspass

            git pull origin main

            docker compose build

            docker compose up -d

            for i in $(seq 1 12); do
              if curl -fsS http://127.0.0.1:5000/api/health > /dev/null; then
                echo "Backend healthy"
                exit 0
              fi
              echo "Waiting for backend health... ($i/12)"
              sleep 5
            done

            echo "Backend unhealthy after deploy"
            exit 1
          SCRIPT

      - name: Deployment summary
        if: always()
        run: |
          echo "Deploy ke ${{ secrets.EC2_HOST }} (environment: ${{ github.event.inputs.environment }}) selesai."
