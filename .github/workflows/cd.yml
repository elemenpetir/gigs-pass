name: Deploy to AWS EC2

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_run'
    permissions:
      id-token: write      # Required for OIDC
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Inspect OIDC Token Claims
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          echo "=== JWT PAYLOAD ==="
          echo $TOKEN | cut -d. -f2 | base64 --decode 2>/dev/null | jq '{sub: .sub, aud: .aud, repository: .repository}'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::196985821420:role/gigspass-ssm-inline-policy
          aws-region: ap-southeast-1
          role-session-name: gigspass-deploy

      - name: Deploy via SSM
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          set -e
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["cd /opt/gigspass && git config --global --add safe.directory /opt/gigspass && git pull origin main && docker compose build && docker compose up -d"]' \
            --comment "Deploy gigspass $(date -u +%Y%m%d-%H%M%S)" \
            --output text --query "Command.CommandId")
          
          echo "Command ID: $COMMAND_ID"
          
          # Poll for completion
          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --output text --query "Status")
            
            echo "Status: $STATUS ($i/30)"
            
            if [[ "$STATUS" == "Success" ]]; then
              echo "Deploy successful"
              exit 0
            elif [[ "$STATUS" == "Failed" || "$STATUS" == "Cancelled" || "$STATUS" == "TimedOut" ]]; then
              # Get output for debugging
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --output text --query "StandardErrorContent"
              exit 1
            fi
            sleep 10
          done
          
          echo "Timeout waiting for deploy"
          exit 1

      - name: Verify backend health
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          for i in $(seq 1 12); do
            if curl -fsS "http://$EC2_HOST/api/health" > /dev/null; then
              echo "Backend healthy"
              exit 0
            fi
            echo "Waiting for backend health... ($i/12)"
            sleep 5
          done
          echo "Backend unhealthy after deploy"
          exit 1